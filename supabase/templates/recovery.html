<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your Pocket CFO password</title>
  </head>
  <body style="margin:0;background:#f2f1ee;color:#111111;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f2f1ee;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:4px solid #111111;border-radius:24px;">
            <tr>
              <td style="padding:28px;">
                <div style="display:inline-block;margin-bottom:24px;padding:10px 14px;background:#facc15;border:3px solid #111111;border-radius:12px;font-size:20px;font-weight:900;">
                  Pocket CFO
                </div>
                <h1 style="margin:0 0 14px;font-size:30px;line-height:1.1;text-transform:uppercase;">Reset your password</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.55;">
                  We received a request to reset your Pocket CFO password. Use the button below to choose a new one.
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:block;padding:16px 20px;background:#111111;color:#facc15;border-radius:14px;text-align:center;font-size:15px;font-weight:900;text-decoration:none;text-transform:uppercase;letter-spacing:1px;">
                  Reset Pocket CFO password
                </a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#666666;">
                  If you did not request this, you can safely ignore this email. This link can only be used once.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
